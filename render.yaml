# Demonstração do GIRO no Render (plano grátis), com HTTPS em https://giro-demo.onrender.com
# (ou parecido). Passo a passo no README, seção "Demonstração online".
# Grátis tem limites: o serviço dorme após 15 min sem visitas (acorda em ~1 min). O banco é
# um arquivo SQLite dentro do contêiner (infra/render/iniciar.sh), refeito a cada vez que
# acorda: nada de banco à parte que expira. Só dados simulados: nada de câmera ou cliente
# real aqui.
services:
  - type: web
    name: giro-demo
    runtime: docker
    plan: free
    region: virginia # o mais perto do Brasil entre os do Render
    dockerfilePath: ./infra/render/Dockerfile
    dockerContext: .
    healthCheckPath: /api/saude
    envVars:
      - key: GIRO_SEGREDO_JWT
        generateValue: true
      - key: GIRO_SENHA_DEMO # senha de todos os acessos de demonstração (mínimo 10 letras)
        sync: false
      - key: GIRO_AMBIENTE
        value: producao
      - key: GIRO_COOKIE_SEGURO
        value: "true"
      - key: GIRO_DEMO
        value: "1"
