descricao: >
  A pergunta do Marcos: "por que a mesa 7 ficou vinte minutos suja numa sexta lotada?".
  A turma sai às 70:00, a equipe recebe o alerta de mesa vaga, mas ninguém libera.
  Só às 91:00 uma nova turma senta na mesa suja. O sistema registra 21 minutos parada.

