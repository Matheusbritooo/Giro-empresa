  - {em: "25:30", mesa: 1, em_pe: 0}
  - {em: "38:00", mesa: 1, em_pe: 1}
  - {em: "38:30", mesa: 1, em_pe: 0}
  - {em: "45:00", mesa: 1, sentados: 0}
  - {em: "52:00", mesa: 1, acao: liberar}

