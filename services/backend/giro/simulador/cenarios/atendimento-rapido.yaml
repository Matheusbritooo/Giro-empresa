  - {em: "2:00", mesa: 1, em_pe: 1}
  - {em: "2:40", mesa: 1, em_pe: 0}
  - {em: "12:00", mesa: 1, em_pe: 1}
  - {em: "12:30", mesa: 1, em_pe: 0}
