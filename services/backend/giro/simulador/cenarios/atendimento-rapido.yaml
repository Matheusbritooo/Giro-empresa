descricao: >
  O caso ideal. Casal senta na mesa 1, o garçom chega em 2 minutos e volta três vezes
  durante o jantar (traz os pratos, passa para ver se está tudo bem, traz a conta). Eles
  vão embora e a equipe libera a mesa 6 minutos depois. Nenhum alerta de atendimento nem
  de mesa sem visita.

